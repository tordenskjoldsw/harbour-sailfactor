[package]
name = "sailtoken-core"
version = "0.1.0"
edition = "2021"
# The Rust toolchain in the SailfishOS-5.1.0.11 target is 1.75.
rust-version = "1.75"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
argon2 = { version = "0.5", default-features = false, features = ["zeroize"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["zeroize"] }
chacha20 = { version = "0.9", features = ["zeroize"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.2"
hmac = "0.12"
quick-xml = "0.39"
rqrr = { version = "0.10", default-features = false }
salsa20 = { version = "0.10", features = ["zeroize"] }
sha1 = { version = "0.10", default-features = false }
sha2 = "0.10"
twofish = { version = "0.7", features = ["zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
# Unwinding across the C FFI boundary is undefined behavior.
panic = "abort"
lto = true
codegen-units = 1

# Parsers of untrusted input abort on an arithmetic overflow instead of
# wrapping; the crypto crates keep their release speed.
[profile.release.package.sailtoken-core]
overflow-checks = true

[profile.dev]
panic = "abort"

# Test vectors use production KDF parameters; unoptimized crypto would take minutes.
[profile.dev.package."*"]
opt-level = 3
